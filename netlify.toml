# Netlify deploy config
# Evita publicar el root (incluye node_modules con rutas inválidas como '#')
# y construye/publica solo el build del frontend (CRA).

[build]
  base = "frontend"
  command = "npm run build-legacy"
  publish = "build"

[build.environment]
  # Opcional: fija versión de Node para reproducibilidad.
  NODE_VERSION = "18"
